server {
    listen 443 ssl http2;
    server_name networth.l3xj.com;

    ssl_certificate /etc/letsencrypt/live/l3xj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l3xj.com/privkey.pem;

    location / {
        proxy_pass http://10.0.1.20:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
